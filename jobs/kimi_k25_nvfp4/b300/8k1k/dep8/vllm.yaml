name: "kimi_k25_nvfp4_b300_dep8_vllm_baseline_sweep"

model:
  path: "kimi25-fp4" # Uses alias from srtslurm.yaml
  container: "vllm_stable" # Uses alias from srtslurm.yaml
  precision: "fp4"

identity:
  model:
    repo: "nvidia/Kimi-K2.5-NVFP4"
  container:
    image: "vllm/vllm-openai:v0.19.1-cu130"
  frameworks:
    vllm: "0.19.1+cu130"

resources:
  gpu_type: "b300"
  gpus_per_node: 8
  agg_nodes: 1
  agg_workers: 1
  gpus_per_agg: 8

frontend:
  type: "vllm"

backend:
  type: vllm

  aggregated_environment:
    TRTLLM_ENABLE_PDL: "0"
    TORCHINDUCTOR_ENABLE_PDL: "0"

  vllm_config:
    aggregated:
      kv-cache-dtype: "fp8"
      served-model-name: "nvidia/Kimi-K2.5-NVFP4"
      gpu-memory-utilization: 0.95
      tensor-parallel-size: 1
      enable-expert-parallel: true
      data-parallel-size: 8
      trust-remote-code: true
      max-num-batched-tokens: 32768
      max-model-len: 32768
      max-num-seqs: 1024
      max-cudagraph-capture-size: 1024
      no-enable-prefix-caching: true

benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
  req_rate: "inf"
